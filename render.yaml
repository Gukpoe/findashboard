services:
  - type: web
    name: findashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    envVars:
      - key: REFRESH_SECONDS
        value: "60"
      - key: MIN_OPT_VOLUME
        value: "5000"
